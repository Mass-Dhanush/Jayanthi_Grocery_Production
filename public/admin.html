<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jayanthi Grocery Admin</title><style>
:root{--g:#075b38;--gold:#f5c842;--ink:#10231b;--muted:#68786f;--line:#e2ece6;--bg:#f4f8f5;--danger:#a43f32}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:25px auto;padding:15px}.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 15px 40px #0000000b}.login{max-width:430px;margin:70px auto}.input{width:100%;padding:12px;margin:6px 0 10px;border:1px solid #d8e5dd;border-radius:10px}.btn{border:0;background:var(--g);color:#fff;padding:10px 14px;border-radius:10px;font-weight:900}.danger{background:var(--danger)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:16px;border-radius:15px;background:#eef7f1}.stat b{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:900}.tab.active{background:var(--g);color:#fff}.item{padding:13px 0;border-bottom:1px solid #edf1ee}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf1ee;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef7f1;color:var(--g);font-size:11px;font-weight:900}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar .input{margin:0}.toast{position:fixed;right:18px;bottom:18px;background:#063d29;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:99}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:8px}.stats{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto}}
</style></head><body><div class="wrap"><div id="app"></div></div><div id="toast" class="toast"></div><script>
let csrf='',products=[],categories=[],orders=[];const $=id=>document.getElementById(id);const money=n=>'Rs. '+Number(n||0).toLocaleString('en-LK');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function loginView(){app.innerHTML=`<div class="box login"><h2>🔐 Jayanthi Grocery Admin</h2><p class="muted">Secure server-side administration.</p><input class="input" id="u" placeholder="Username" autocomplete="username"><input class="input" id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="login" style="width:100%">Login</button><p id="err" style="color:var(--danger)"></p></div>`;$('login').onclick=login;$('p').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});csrf=d.csrfToken;dashboard(d.username)}catch(e){$('err').textContent=e.message}}
async function boot(){try{const d=await api('/api/admin/me');csrf=d.csrfToken;dashboard(d.username)}catch{loginView()}}
function dashboard(user){app.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1 style="margin:0">Jayanthi Grocery Admin</h1><div class="muted">Signed in as <b>${esc(user)}</b></div></div><button class="btn" id="logout">Logout</button></div><div id="stats" class="stats"></div><div class="tabs"><button class="tab active" data-tab="products">Products</button><button class="tab" data-tab="categories">Categories</button><button class="tab" data-tab="orders">Orders</button></div><div id="panel"></div></div>`;$('logout').onclick=logout;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderTab(b.dataset.tab)});loadAll()}
async function loadAll(){try{[products,categories,orders]=await Promise.all([api('/api/admin/products'),api('/api/admin/categories'),api('/api/admin/orders')]);const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class="stat"><b>${s.products}</b><br><small>Active products</small></div><div class="stat"><b>${s.low}</b><br><small>Low stock</small></div><div class="stat"><b>${s.orders}</b><br><small>Total orders</small></div><div class="stat"><b>${money(s.revenue)}</b><br><small>Revenue</small></div>`;renderTab('products')}catch(e){toast(e.message)}}
function renderTab(tab){if(tab==='products')renderProducts();if(tab==='categories')renderCategories();if(tab==='orders')renderOrders()}
function renderProducts(){const cats=categories.filter(c=>c.active);$('panel').innerHTML=`<div class="grid"><div><h3>➕ Add Product</h3><input class="input" id="pn" placeholder="Product name"><input class="input" id="ps" placeholder="Size / unit"><select class="input" id="pc">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input class="input" id="pp" type="number" min="0" placeholder="Price (LKR)"><input class="input" id="pst" type="number" min="0" placeholder="Stock"><input class="input" id="pd" type="number" min="0" max="100" placeholder="Discount %"><input class="input" id="pi" placeholder="Image URL (optional)"><textarea class="input" id="pdesc" rows="4" placeholder="Description"></textarea><button class="btn" id="addp">Add Product</button></div><div><h3>Products</h3><div class="toolbar"><input class="input" id="psrch" placeholder="Search products..."></div><div id="plist"></div></div></div>`;$('addp').onclick=addProduct;$('psrch').oninput=renderProductList;renderProductList()}
function renderProductList(){const q=($('psrch')?.value||'').toLowerCase();$('plist').innerHTML=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q)).map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${esc(p.size)} · ${money(p.final_price)} · Stock ${p.stock} · ${p.discount}% off</div><div class="actions"><button class="btn" data-edit="${p.id}">Edit</button><button class="btn danger" data-del="${p.id}">Disable</button></div></div>`).join('')||'<p class="muted">No products.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(products.find(p=>p.id==b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.del))}
async function addProduct(){const body={name:$('pn').value,size:$('ps').value,category_id:Number($('pc').value),price:Number($('pp').value),stock:Number($('pst').value||0),discount:Number($('pd').value||0),image:$('pi').value,description:$('pdesc').value};try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});toast('Product added');loadAll()}catch(e){toast(e.message)}}
async function editProduct(p){if(!p)return;const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price (LKR)',p.price);if(price===null)return;const stock=prompt('Stock',p.stock);if(stock===null)return;const discount=prompt('Discount %',p.discount);if(discount===null)return;try{await api('/api/admin/products/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({...p,name,price:Number(price),stock:Number(stock),discount:Number(discount),category_id:p.category_id||categories.find(c=>c.name===p.category)?.id})});toast('Product updated');loadAll()}catch(e){toast(e.message)}}
async function deleteProduct(id){if(!confirm('Disable this product?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE',headers:{'X-CSRF-Token':csrf}});toast('Product disabled');loadAll()}catch(e){toast(e.message)}}
function renderCategories(){$('panel').innerHTML=`<div class="grid"><div><h3>➕ Add Category</h3><input class="input" id="cn" placeholder="Category name"><input class="input" id="ci" placeholder="Image URL (optional)"><button class="btn" id="addc">Add Category</button></div><div><h3>Categories</h3><div id="clist"></div></div></div>`;$('addc').onclick=addCategory;$('clist').innerHTML=categories.map(c=>`<div class="item"><b>${esc(c.name)}</b> <span class="pill">${c.active?'Active':'Disabled'}</span><div class="actions"><button class="btn" data-ce="${c.id}">Edit</button>${c.active?`<button class="btn danger" data-cd="${c.id}">Disable</button>`:''}</div></div>`).join('');document.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>editCategory(categories.find(c=>c.id==b.dataset.ce)));document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.cd))}
async function addCategory(){try{await api('/api/admin/categories',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({name:$('cn').value,image:$('ci').value})});toast('Category added');loadAll()}catch(e){toast(e.message)}}
async function editCategory(c){const name=prompt('Category name',c.name);if(name===null)return;try{await api('/api/admin/categories/'+c.id,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({name,image:c.image||''})});toast('Category updated');loadAll()}catch(e){toast(e.message)}}
async function deleteCategory(id){if(!confirm('Disable this category?'))return;try{await api('/api/admin/categories/'+id,{method:'DELETE',headers:{'X-CSRF-Token':csrf}});toast('Category disabled');loadAll()}catch(e){toast(e.message)}}
function renderOrders(){$('panel').innerHTML=`<h3>📦 Orders</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${esc(o.order_no)}</b></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.phone)}</span></td><td>${money(o.total)}</td><td><span class="pill">${esc(o.status)}</span></td><td>${esc(o.created_at)}</td><td><button class="btn" data-view="${o.id}">View</button></td></tr>`).join('')||'<tr><td colspan="6">No orders.</td></tr>'}</tbody></table></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewOrder(b.dataset.view))}
async function viewOrder(id){try{const o=await api('/api/admin/orders/'+id);const next=prompt('Status: Pending / Confirmed / Processing / Out for Delivery / Completed / Cancelled',o.status);if(next===null)return;if(next!==o.status){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({status:next})});toast('Order updated');loadAll()}else alert(`Order ${o.order_no}\n${o.customer_name}\n${o.address}, ${o.city}\nTotal: ${money(o.total)}\n\n`+o.items.map(i=>`${i.product_name} × ${i.quantity} = ${money(i.line_total)}`).join('\n'))}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}})}finally{location.reload()}}boot();
</script></body></html>
